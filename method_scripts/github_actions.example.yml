name: Validate SQL planning catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r method_scripts/requirements.txt
      - run: python method_scripts/check_catalog.py
      - run: python -m unittest discover -s tests -v
      - name: Check generated artifacts are current
        run: |
          python method_scripts/generate_agent.py
          git diff --exit-code -- agent
          test -z "$(git ls-files --others --exclude-standard agent)"
